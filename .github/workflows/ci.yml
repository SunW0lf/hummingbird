name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: |
          echo "No linter configured yet for the static site (plain HTML/CSS)."
          echo "This step is intentionally a documented placeholder rather than a fake pass - see CONTRIBUTING.md."

      - name: Test
        run: ./scripts/test

      - name: Build
        run: ./scripts/build

      - name: Dependency audit
        run: npm audit --audit-level=high || echo "npm audit reported issues - review before relying on this devDependency in production tooling."

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: ./scripts/build

      - name: Deploy (skips gracefully until CLOUDFLARE_API_TOKEN secret exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not yet configured - skipping deploy."
            echo "This is expected during Phase 0 bootstrap. See docs/decisions/0005-ci-gated-production-deployment.md."
            exit 0
          fi
          ./scripts/deploy
