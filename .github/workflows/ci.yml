name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Checks, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: ./scripts/test

      - name: Build
        run: ./scripts/build

      - name: Dependency audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Phase 2E: provision offer pilot') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ./scripts/build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/deploy

      - name: Production public-read smoke test
        env:
          HEALTHCHECK_URL: https://datum.quest
        run: ./scripts/healthcheck

      - name: Production offer-route smoke test
        env:
          HEALTHCHECK_URL: https://datum.quest
        run: bash scripts/offer-healthcheck

      - name: One-shot production offer lifecycle smoke
        if: "${{ startsWith(github.event.head_commit.message, 'Phase 2E: open offer pilot') }}"
        env:
          HEALTHCHECK_URL: https://datum.quest
        run: node scripts/offer-production-smoke.mjs
