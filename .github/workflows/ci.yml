name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Checks, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: ./scripts/test

      - name: Build
        run: ./scripts/build

      - name: Dependency audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Phase 2E: provision offer pilot') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ./scripts/build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/deploy

      - name: Production public-read smoke test
        env:
          HEALTHCHECK_URL: https://datum.quest
        run: ./scripts/healthcheck

      - name: Production offer-route smoke test
        env:
          HEALTHCHECK_URL: https://datum.quest
        run: bash scripts/offer-healthcheck

      - name: One-shot production offer lifecycle smoke
        if: "${{ startsWith(github.event.head_commit.message, 'Phase 2E: open offer pilot') }}"
        env:
          HEALTHCHECK_URL: https://datum.quest
        run: node scripts/offer-production-smoke.mjs

  mirror:
    # ADR 0032: copy the machine-readable files to the `carry` branch so agents
    # whose network reaches GitHub but not datum.quest can still read them.
    name: Refresh the carry mirror
    needs: deploy
    if: "${{ needs.deploy.result == 'success' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ./scripts/build

      - name: Prepare mirror
        run: node scripts/prepare-mirror.mjs dist "$RUNNER_TEMP/carry" "$GITHUB_SHA"

      - name: Replace the carry branch with one fresh commit
        run: |
          git switch --orphan carry-mirror
          git rm -rfq --cached . >/dev/null 2>&1 || true
          git clean -fdxq
          cp -R "$RUNNER_TEMP/carry/." .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Carry mirror of ${GITHUB_SHA}"
          git push --force origin HEAD:refs/heads/carry
