name: Public Read Monitor

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-read-monitor
  cancel-in-progress: true

jobs:
  healthcheck:
    name: Plain-HTTP public read health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public read plane
        env:
          HEALTHCHECK_URL: https://datum.quest
        run: ./scripts/healthcheck
