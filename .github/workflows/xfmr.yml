name: XFMR

on:
  pull_request:
    branches: [main]
    paths:
      - "experimental/xfmr/**"
      - ".github/workflows/xfmr.yml"
  push:
    branches: [main]
    paths:
      - "experimental/xfmr/**"
      - ".github/workflows/xfmr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xfmr-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate XFMR Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config experimental/xfmr/wrangler.jsonc

  deploy:
    name: Deploy XFMR Worker
    needs: validate
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config experimental/xfmr/wrangler.jsonc

      - name: Smoke test xfmr.link
        run: |
          for attempt in 1 2 3 4 5 6; do
            root="$(curl --fail --silent --show-error --max-time 15 https://xfmr.link || true)"
            manifest="$(curl --fail --silent --show-error --max-time 15 https://xfmr.link/.well-known/xfmr || true)"
            if printf '%s' "$root" | grep -q 'Signals only.' && \
               printf '%s' "$manifest" | grep -q '"protocol": "xfmr"' && \
               printf '%s' "$manifest" | grep -q '"status": "experimental"'; then
              printf '%s\n' "$root"
              printf '%s\n' "$manifest"
              exit 0
            fi
            sleep 5
          done
          echo "xfmr.link root or discovery manifest failed smoke test after deployment" >&2
          exit 1
