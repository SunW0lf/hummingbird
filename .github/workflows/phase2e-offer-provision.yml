name: Phase 2E Offer Provisioning

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase2e-offer-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision temporary offer storage
    if: "${{ startsWith(github.event.head_commit.message, 'Phase 2E: provision offer pilot') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Provision, migrate, and bind dedicated OFFER_DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_RECOVERY_TOKEN: ${{ secrets.CLOUDFLARE_D1_RECOVERY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-offer-pilot.mjs
